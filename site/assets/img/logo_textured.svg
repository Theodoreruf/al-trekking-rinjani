<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3a2e"/>
      <stop offset="1" stop-color="#172c23"/>
    </linearGradient>
    <radialGradient id="glow" cx="35" cy="13" r="9" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c8cfcb" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#c8cfcb" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="earth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a6a4c"/>
      <stop offset="1" stop-color="#6b4f38"/>
    </linearGradient>
    <clipPath id="mtn"><path d="M4 38 L19 15 L26 25 L30 19.5 L44 38 Z"/></clipPath>
    <clipPath id="shade"><path d="M19 15 L26 25 L28 38 L20.5 38 Z M30 19.5 L44 38 L32.5 38 Z"/></clipPath>
  </defs>

  <!-- background -->
  <rect x="0.5" y="0.5" width="47" height="47" rx="11.5" fill="url(#bg)" stroke="#6f7a74" stroke-width="1"/>

  <!-- moon -->
  <circle cx="35" cy="13" r="9" fill="url(#glow)"/>
  <circle cx="35" cy="13" r="3.5" fill="#c8cfcb"/>

  <!-- mountain body: lit faces -->
  <path d="M4 38 L19 15 L26 25 L30 19.5 L44 38 Z" fill="#8f9a94"/>
  <!-- shadow faces -->
  <path d="M19 15 L26 25 L28 38 L20.5 38 Z M30 19.5 L44 38 L32.5 38 Z" fill="#6f7a74"/>

  <!-- brown lower slopes -->
  <g clip-path="url(#mtn)">
    <path d="M0 33 Q6 31.2 11 32.2 T21 31.8 T31 31.4 T40 32.2 T48 31.8 V38 H0 Z" fill="url(#earth)"/>
    <path d="M0 35.4 Q8 34.2 14 35.2 T27 34.8 T40 35.3 T48 35" fill="none" stroke="#5a4230" stroke-width="0.8" stroke-linecap="round" opacity="0.7"/>
  </g>
  <g clip-path="url(#shade)">
    <path d="M0 33 Q6 31.2 11 32.2 T21 31.8 T31 31.4 T40 32.2 T48 31.8 V38 H0 Z" fill="#5a4230"/>
  </g>

  <!-- snow caps: lit + shaded -->
  <path d="M19 15 L20.4 25.4 L19.5 27 L16 22.5 Z" fill="#eef0ef"/>
  <path d="M19 15 L26 25 L22.5 23.5 L20.4 25.4 Z" fill="#c8cfcb"/>
  <path d="M30 19.5 L30.6 24.4 L28.6 25.6 L27.6 22.8 Z" fill="#eef0ef"/>
  <path d="M30 19.5 L33.5 24.5 L31 24 L30.6 24.4 Z" fill="#c8cfcb"/>

  <!-- brown foreground hill -->
  <path d="M4 38 Q11 32.5 19 35.5 Q24 37 27 38 Z" fill="#7a5c43"/>
  <path d="M27 38 Q34 33.5 44 38 Z" fill="#6b4f38"/>

  <!-- ground lines -->
  <path d="M4 38 H44" stroke="#c8cfcb" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M12 42 H36" stroke="#6f7a74" stroke-width="1.5" stroke-linecap="round"/>
</svg>
